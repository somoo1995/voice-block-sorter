# 카메라 고정값 — start_demo.sh 가 기동 때 v4l2-ctl 로 넣고 다시 읽어 맞대 본다(재부팅·USB 다시 꽂기 때마다 풀림).
# 값의 정본은 이 파일 하나다. SETUP.md §1 표는 옮겨 적은 것 — 바꾸면 둘 다.
# 한 줄 = 이름 · 장치(/dev/v4l/by-id, 꽂는 자리가 바뀌어도 같은 이름) · 단계1 · 단계2 …
# 단계는 차례대로 따로 넣는다: auto 를 먼저 꺼야 값이 먹는다. 한 단계 안은 쉼표로 잇고 빈칸은 쓰지 않는다.
# 위 카메라: 노출 수동·자동 초점 끔(10-23 아침 총괄 값)
위 /dev/v4l/by-id/usb-ZVCAI_USB_Camera_zvcai231100001-video-index0 auto_exposure=1,exposure_dynamic_framerate=0,white_balance_automatic=0,focus_automatic_continuous=0,power_line_frequency=2 exposure_time_absolute=200,white_balance_temperature=4600,focus_absolute=130
# 손목 카메라: 10-23 10:08 총괄이 9조합을 비교해 정함, 오늘 집기 녹화(grasp)도 이 값
손목 /dev/v4l/by-id/usb-icSpring_icspring_camera_20240307110322-video-index0 auto_exposure=1,white_balance_automatic=0,power_line_frequency=2 white_balance_temperature=4600,exposure_time_absolute=250,gain=0
